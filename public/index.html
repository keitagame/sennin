<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>専ブラ - Sen2ch</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body data-theme="dark">
  <div id="app" class="app">
    <!-- ヘッダー -->
    <header class="topbar">
      <button id="navToggle" class="iconbtn only-narrow" title="メニュー" aria-label="メニュー">☰</button>
      <div class="brand">
        <span class="brand-mark">◈</span>
        <span class="brand-text">専ブラ<span class="brand-sub">Sen2ch</span></span>
      </div>
      <nav class="tabs">
        <button class="tab active" data-view="boards">板</button>
        <button class="tab" data-view="favorites">お気に入り</button>
        <button class="tab" data-view="history">履歴</button>
      </nav>
      <div class="topbar-right">
        <button id="refreshBtn" class="iconbtn" title="更新">⟳</button>
        <button id="settingsBtn" class="iconbtn" title="設定">⚙</button>
      </div>
    </header>

    <div class="layout">
      <!-- 左ペイン: 板一覧 / お気に入り / 履歴 -->
      <aside id="sidePane" class="pane side-pane">
        <div class="pane-head">
          <input id="boardFilter" class="filter-input" placeholder="板・スレを検索…" />
        </div>
        <div id="sideContent" class="pane-body"></div>
        <div class="pane-foot">
          <button id="addBoardBtn" class="ghost-btn">+ 板を追加</button>
          <button id="addMenuBtn" class="ghost-btn">+ BBSMENU追加</button>
        </div>
      </aside>

      <!-- 中央ペイン: スレッド一覧 -->
      <section id="threadPane" class="pane thread-pane">
        <div class="pane-head">
          <div id="threadPaneTitle" class="pane-title">板を選択してください</div>
          <select id="threadSort" class="mini-select">
            <option value="momentum">勢い順</option>
            <option value="new">新着順</option>
            <option value="res">レス数順</option>
          </select>
        </div>
        <div id="threadList" class="pane-body thread-list"></div>
      </section>

      <!-- 右ペイン: スレ本文 -->
      <section id="postPane" class="pane post-pane">
        <div class="pane-head">
          <button id="backBtn" class="iconbtn only-narrow" title="戻る">←</button>
          <div id="postPaneTitle" class="pane-title">スレッドを選択してください</div>
          <div class="post-pane-actions">
            <button id="favBtn" class="iconbtn" title="お気に入り登録">☆</button>
            <button id="ngBtn" class="iconbtn" title="NG設定">🚫</button>
          </div>
        </div>
        <div id="postList" class="pane-body post-list"></div>
        <div id="postStatus" class="post-status"></div>
      </section>
    </div>
  </div>

  <!-- モーダル -->
  <div id="modalRoot" class="modal-root hidden"></div>

  <script src="api-bridge.js"></script>
  <script src="app.js"></script>
  <script type="module" src="discord-bootstrap.js"></script>
</body>
</html>
